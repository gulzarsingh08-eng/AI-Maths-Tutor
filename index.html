<!DOCTYPE html>
<html>
<head>
  <title>AI Math Tutor</title>
</head>

<body style="text-align:center; font-family: Arial;">

  <h1>AI Math Tutor</h1>

  <p>Ask any math question</p>

  <input type="text" id="question" placeholder="Type your question here" style="width:300px; padding:10px;">

  <br><br>

  <button onclick="getAnswer()">Submit</button>

  <h2 id="answer"></h2>

  <script>
    function getAnswer() {
      let q = document.getElementById("question").value;

      document.getElementById("answer").innerText =
        "You asked: " + q;
    }
  </script>

</body>
</html>
