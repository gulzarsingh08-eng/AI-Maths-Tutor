<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Math Tutor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            resize: vertical;
            min-height: 100px;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .answer-section {
            margin-top: 30px;
        }

        .answer-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            min-height: 150px;
            border: 2px solid #e0e0e0;
        }

        .answer-box.empty {
            display: flex;
            justify-content: center;
            align-items: center;
            color: #999;
            font-style: italic;
        }

        .answer-content {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .examples {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .examples h3 {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .example-btn {
            padding: 8px 16px;
            background: #f0f0f0;
            border: none;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s ease;
            width: auto;
        }

        .example-btn:hover {
            background: #e0e0e0;
            transform: none;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 AI Math Tutor</h1>
        <p class="subtitle">Ask any math question and get a helpful explanation!</p>

        <div class="input-section">
            <label for="question">Your Math Question:</label>
            <textarea 
                id="question" 
                placeholder="Type your math question here... For example: 'What is 25% of 80?' or 'How do I solve 2x + 5 = 15?'"
            ></textarea>
        </div>

        <button onclick="submitQuestion()">Get Answer</button>

        <div class="answer-section">
            <label>Answer:</label>
            <div class="answer-box empty" id="answerBox">
                <span>Your answer will appear here</span>
            </div>
        </div>

        <div class="examples">
            <h3>Try these examples:</h3>
            <div class="example-buttons">
                <button class="example-btn" onclick="setExample('What is 15% of 200?')">Percentages</button>
                <button class="example-btn" onclick="setExample('Solve for x: 3x - 7 = 14')">Algebra</button>
                <button class="example-btn" onclick="setExample('What is the area of a circle with radius 5?')">Geometry</button>
                <button class="example-btn" onclick="setExample('Simplify: 3/4 + 2/3')">Fractions</button>
            </div>
        </div>
    </div>

    <script>
        function setExample(text) {
            document.getElementById('question').value = text;
        }

        function submitQuestion() {
            const question = document.getElementById('question').value.trim();
            const answerBox = document.getElementById('answerBox');

            if (!question) {
                answerBox.className = 'answer-box';
                answerBox.innerHTML = '<div class="answer-content" style="color: #e74c3c;">Please enter a math question first!</div>';
                return;
            }

            // Show loading state
            answerBox.className = 'answer-box';
            answerBox.innerHTML = '<div class="answer-content">🤔 Thinking...</div>';

            // Simulate AI response (replace with actual API call)
            setTimeout(() => {
                const answer = generateAnswer(question);
                answerBox.innerHTML = `<div class="answer-content">${answer}</div>`;
            }, 1000);
        }

        function generateAnswer(question) {
            // This is a simple demo response generator
            // In a real app, you would call an AI API here
            
            const q = question.toLowerCase();

            // Basic percentage calculation
            if (q.includes('%') && q.includes('of')) {
                const match = question.match(/(\d+)%\s*of\s*(\d+)/i);
                if (match) {
                    const percent = parseFloat(match[1]);
                    const number = parseFloat(match[2]);
                    const result = (percent / 100) * number;
                    return `📝 Solution:\n\nTo find ${percent}% of ${number}:\n\n` +
                           `Step 1: Convert ${percent}% to a decimal: ${percent}/100 = ${percent/100}\n\n` +
                           `Step 2: Multiply: ${percent/100} × ${number} = ${result}\n\n` +
                           `✅ Answer: ${percent}% of ${number} = ${result}`;
                }
            }

            // Simple equation solving (ax + b = c or ax - b = c)
            if (q.includes('solve') && q.includes('x')) {
                const match = question.match(/(\d*)x\s*([+-])\s*(\d+)\s*=\s*(\d+)/i);
                if (match) {
                    const a = match[1] ? parseInt(match[1]) : 1;
                    const op = match[2];
                    const b = parseInt(match[3]);
                    const c = parseInt(match[4]);
                    let x;
                    if (op === '+') {
                        x = (c - b) / a;
                        return `📝 Solution:\n\n` +
                               `Given: ${a === 1 ? '' : a}x + ${b} = ${c}\n\n` +
                               `Step 1: Subtract ${b} from both sides:\n${a === 1 ? '' : a}x = ${c} - ${b} = ${c - b}\n\n` +
                               `Step 2: Divide both sides by ${a}:\nx = ${c - b}${a !== 1 ? ' ÷ ' + a : ''} = ${x}\n\n` +
                               `✅ Answer: x = ${x}`;
                    } else {
                        x = (c + b) / a;
                        return `📝 Solution:\n\n` +
                               `Given: ${a === 1 ? '' : a}x - ${b} = ${c}\n\n` +
                               `Step 1: Add ${b} to both sides:\n${a === 1 ? '' : a}x = ${c} + ${b} = ${c + b}\n\n` +
                               `Step 2: Divide both sides by ${a}:\nx = ${c + b}${a !== 1 ? ' ÷ ' + a : ''} = ${x}\n\n` +
                               `✅ Answer: x = ${x}`;
                    }
                }
            }

            // Circle area
            if (q.includes('area') && q.includes('circle') && q.includes('radius')) {
                const match = question.match(/radius\s*(\d+)/i);
                if (match) {
                    const r = parseFloat(match[1]);
                    const area = Math.PI * r * r;
                    return `📝 Solution:\n\n` +
                           `The formula for area of a circle is: A = πr²\n\n` +
                           `Given radius (r) = ${r}\n\n` +
                           `Step 1: Square the radius: ${r}² = ${r * r}\n\n` +
                           `Step 2: Multiply by π (≈ 3.14159):\nA = π × ${r * r} ≈ ${area.toFixed(2)}\n\n` +
                           `✅ Answer: Area ≈ ${area.toFixed(2)} square units`;
                }
            }

            // Fraction addition
            if (q.includes('simplify') || (q.includes('/') && q.includes('+'))) {
                const match = question.match(/(\d+)\/(\d+)\s*\+\s*(\d+)\/(\d+)/);
                if (match) {
                    const n1 = parseInt(match[1]), d1 = parseInt(match[2]);
                    const n2 = parseInt(match[3]), d2 = parseInt(match[4]);
                    const lcd = lcm(d1, d2);
                    const newN1 = n1 * (lcd / d1);
                    const newN2 = n2 * (lcd / d2);
                    const sumN = newN1 + newN2;
                    const gcdVal = gcd(sumN, lcd);
                    const finalN = sumN / gcdVal;
                    const finalD = lcd / gcdVal;
                    
                    return `📝 Solution:\n\n` +
                           `Given: ${n1}/${d1} + ${n2}/${d2}\n\n` +
                           `Step 1: Find common denominator: LCD of ${d1} and ${d2} = ${lcd}\n\n` +
                           `Step 2: Convert fractions:\n` +
                           `${n1}/${d1} = ${newN1}/${lcd}\n` +
                           `${n2}/${d2} = ${newN2}/${lcd}\n\n` +
                           `Step 3: Add numerators: ${newN1} + ${newN2} = ${sumN}\n\n` +
                           `Step 4: Simplify ${sumN}/${lcd} = ${finalN}/${finalD}\n\n` +
                           `✅ Answer: ${finalN}/${finalD}` + (finalN > finalD ? ` or ${Math.floor(finalN/finalD)} ${finalN % finalD}/${finalD}` : '');
                }
            }

            // Default response for unrecognized questions
            return `🤖 This is a demo Math Tutor!\n\n` +
                   `To connect to a real AI, you would need to:\n\n` +
                   `1. Sign up for an AI API (like OpenAI)\n` +
                   `2. Add your API key\n` +
                   `3. Send this question to the API\n\n` +
                   `For now, try these example questions:\n` +
                   `• "What is 25% of 80?"\n` +
                   `• "Solve for x: 2x + 5 = 15"\n` +
                   `• "What is the area of a circle with radius 5?"\n` +
                   `• "Simplify: 3/4 + 2/3"`;
        }

        // Helper functions for fractions
        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        function lcm(a, b) {
            return (a * b) / gcd(a, b);
        }

        // Allow pressing Enter to submit
        document.getElementById('question').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitQuestion();
            }
        });
    </script>
</body>
</html>
